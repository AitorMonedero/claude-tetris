<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
          <span class="energy-hint" id="energy-hint"></span>
        </div>

        <div class="panel-section hidden" id="queue-section">
          <span class="label">SIGUIENTES</span>
          <canvas id="queue-canvas" width="120" height="300"></canvas>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="title-row">
          <h1 class="title">TETRIS</h1>
          <button id="theme-toggle" type="button" aria-label="Cambiar a modo claro">🌙</button>
        </div>

        <div class="panel-section hidden" id="objective-section">
          <span class="label" id="mode-name"></span>
          <span class="objective" id="objective"></span>
        </div>

        <div class="stats">
          <div class="panel-section">
            <span class="label">SCORE</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>
          <div class="panel-section">
            <span class="label">COMBO</span>
            <span class="value combo" id="combo">—</span>
          </div>
        </div>
        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <span class="effect" id="effect"></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> hold</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> <span id="sound">sonido ON</span></li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <div id="mode-menu" class="mode-menu"></div>
        <div id="ability-menu" class="ability-menu hidden"></div>
        <div id="end-actions" class="end-actions hidden">
          <button id="restart-btn">Reintentar</button>
          <button id="menu-btn" class="secondary">Cambiar modo</button>
        </div>
      </div>
    </div>
  </div>

  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
